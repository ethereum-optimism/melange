version: 2

project_name: op-melange

before:
  hooks:
    - go mod verify

builds:
  - id: op-melange
    binary: op-melange
    main: ./
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: darwin
        goarch: amd64
    flags:
      - -trimpath
      - -buildvcs=false
    mod_timestamp: "{{ .CommitTimestamp }}"
    ldflags:
      - -s -w -buildid=
      - -extldflags "-static"
      - -X sigs.k8s.io/release-utils/version.gitVersion={{ .Tag }}
      - -X sigs.k8s.io/release-utils/version.gitCommit={{ .FullCommit }}
      - -X sigs.k8s.io/release-utils/version.gitTreeState=clean
      - -X sigs.k8s.io/release-utils/version.buildDate={{ .CommitDate }}

archives:
  - id: op-melange
    ids:
      - op-melange
    formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE

checksum:
  name_template: checksums.txt
  algorithm: sha256

sboms:
  - id: archive
    artifacts: archive
    documents:
      - "{{ .ArtifactName }}.sbom.json"
    cmd: syft
    env:
      - SYFT_CHECK_FOR_APP_UPDATE=false
    args:
      - "$artifact"
      - "--output"
      - "spdx-json=$document"

changelog:
  disable: true

release:
  draft: false
  prerelease: "false"
