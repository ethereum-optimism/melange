name: release

on:
  push:
    tags:
      - v*-op.*

permissions: {}

jobs:
  release:
    permissions:
      contents: write
      id-token: write
      attestations: write
    uses: ethereum-optimism/factory/.github/workflows/goreleaser.yaml@00b80b91199b784a5f3887ffe0c416ce23b04e32
    with:
      tag: ${{ github.ref_name }}
      config: .goreleaser.yaml
      environment: goreleaser
      mise-install-args: go goreleaser-pro syft
    secrets:
      GORELEASER_KEY: ${{ secrets.GORELEASER_KEY }}
