name: release

on:
  push:
    tags:
      - v*-op.*

permissions: {}

jobs:
  release:
    permissions:
      contents: write
      id-token: write
      attestations: write
    uses: ethereum-optimism/factory/.github/workflows/goreleaser.yaml@10b9826b174192cef1c05f244155f6f8012d9e0f
    with:
      tag: ${{ github.ref_name }}
      config: .goreleaser.yaml
      environment: goreleaser
      mise-install-args: go goreleaser-pro syft
    secrets:
      GORELEASER_KEY: ${{ secrets.GORELEASER_KEY }}
